# Checks for every push and pull request. Nothing here needs secrets, a Claude sign-in, or the
# GitHub API: the guard tests use a local stand-in for GitHub (scripts/ci/mock-github.py).
# Every step is a script in scripts/ci/ that also runs on your own computer.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Claude Code version the panels were last tested with (raise it after mods-latest passes).
  # Users need at least 2.1.287 (health.sh checks that); this is the newest one checked here.
  CLAUDE_CODE_TESTED: "2.1.296"

jobs:
  linux:
    name: Linux (lint, JSON, mods, guard, parity)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Shell scripts (bash -n, shellcheck -S warning)
        run: bash scripts/ci/lint-shell.sh
      - name: JSON files parse
        run: bash scripts/ci/check-json.sh
      - name: JavaScript modules (node --check)
        run: bash scripts/ci/check-node.sh
      - name: Claude/Codex skill parity and blank starter files
        run: bash scripts/ci/check-parity.sh
      - name: Product manifest is up to date
        run: bash scripts/build-manifest.sh --check
      - name: Blank pages are on the Default theme
        run: node .claude/skills/page-design/scripts/apply-theme.mjs --check-blank
      - name: Guard fixtures (guard.sh, wrappers, pre-push)
        run: bash scripts/ci/guard-fixtures.sh --impl sh
      - name: Guard parity (guard.sh vs guard.ps1 under PowerShell 7)
        env:
          PS_EXE: pwsh
        run: bash scripts/ci/guard-parity.sh
      - name: PowerShell scripts parse (PowerShell 7)
        shell: pwsh
        run: ./scripts/ci/parse-powershell.ps1
      - name: my-data backup and reset (bash)
        run: bash scripts/ci/mydata-smoke.sh --impl sh
      - name: Startup summary (summary.sh, and session-start.ps1 under PowerShell 7)
        env:
          PS_EXE: pwsh
        run: |
          bash scripts/ci/summary-fixtures.sh --impl sh
          bash scripts/ci/summary-fixtures.sh --impl ps
      - name: Health check fixtures (bash, and health.ps1 under PowerShell 7)
        env:
          PS_EXE: pwsh
        run: |
          bash scripts/ci/health-fixtures.sh --impl sh
          bash scripts/ci/health-fixtures.sh --impl ps
      - name: Health check runs on a fresh checkout
        run: |
          out="$(bash .claude/skills/health/scripts/health.sh)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^OK: safety check (bash)'
          printf '%s\n' "$out" | grep -q '^summary: '
      - name: End-to-end, bash (fresh clone, /update, /my-data, theme + git pull)
        run: |
          python scripts/ci/e2e-fresh.py --impl sh
          python scripts/ci/e2e-update.py --impl sh
          python scripts/ci/e2e-mydata.py --impl sh
          python scripts/ci/e2e-sample.py --impl sh
          python scripts/ci/e2e-theme-git.py
      - name: Published dashboard copies and the Claude Dashboard page
        run: python scripts/ci/check-dashboard-type.py
      - name: End-to-end, PowerShell 7 (fresh clone, /update, /my-data)
        env:
          PS_EXE: pwsh
        run: |
          python scripts/ci/e2e-fresh.py --impl ps
          python scripts/ci/e2e-update.py --impl ps
          python scripts/ci/e2e-mydata.py --impl ps
          python scripts/ci/e2e-sample.py --impl ps
      - name: Install Claude Code (the version the panels were last tested with)
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_TESTED}"
          claude --version
      - name: Mods (claude plugin validate --strict, claude plugin test)
        env:
          DISABLE_AUTOUPDATER: "1"
          DISABLE_TELEMETRY: "1"
        run: bash scripts/ci/check-mods.sh

  mods-latest:
    # The newest Claude Code release, to hear early when an update changes the panel API. A failure
    # here doesn't fail the build; when it passes on a newer version, raise CLAUDE_CODE_TESTED.
    name: Mods on the latest Claude Code (early warning)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install the latest Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version
      - name: Mods (claude plugin validate --strict, claude plugin test)
        env:
          DISABLE_AUTOUPDATER: "1"
          DISABLE_TELEMETRY: "1"
        run: bash scripts/ci/check-mods.sh

  macos:
    name: macOS (bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: The system bash is 3.2, like on users' Macs
        run: /bin/bash --version | head -1
      - name: Product manifest with /bin/bash 3.2
        run: /bin/bash scripts/build-manifest.sh --check
      - name: Guard fixtures with /bin/bash 3.2
        run: /bin/bash scripts/ci/guard-fixtures.sh --impl sh
      - name: my-data backup and reset with /bin/bash 3.2
        run: /bin/bash scripts/ci/mydata-smoke.sh --impl sh
      - name: Startup summary with /bin/bash 3.2 and the system awk
        run: /bin/bash scripts/ci/summary-fixtures.sh --impl sh
      - name: Health check fixtures with /bin/bash 3.2
        run: /bin/bash scripts/ci/health-fixtures.sh --impl sh
      - name: Health check with /bin/bash 3.2
        run: |
          out="$(/bin/bash .claude/skills/health/scripts/health.sh)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^OK: safety check (bash)'
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: End-to-end with /bin/bash 3.2 and BSD tools (fresh clone, /update, /my-data, theme + git pull)
        env:
          BASH_EXE: /bin/bash
        run: |
          python3 scripts/ci/e2e-fresh.py --impl sh
          python3 scripts/ci/e2e-update.py --impl sh
          python3 scripts/ci/e2e-mydata.py --impl sh
          python3 scripts/ci/e2e-sample.py --impl sh
          python3 scripts/ci/e2e-theme-git.py
          python3 scripts/ci/check-dashboard-type.py

  windows:
    name: Windows (PowerShell 5.1, PowerShell 7, Git Bash)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Keep Windows' usual line-ending conversion on, as on users' machines; .gitattributes keeps .sh files LF.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: PowerShell scripts parse (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\ci\parse-powershell.ps1
      - name: PowerShell scripts parse (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File scripts\ci\parse-powershell.ps1
      - name: Product manifest matches a Windows (CRLF) checkout, under Git Bash
        shell: bash
        run: bash scripts/build-manifest.sh --check
      - name: Blank pages are on the Default theme (CRLF checkout)
        shell: bash
        run: node .claude/skills/page-design/scripts/apply-theme.mjs --check-blank
      - name: Guard fixtures, guard.ps1 + Codex wrappers under Windows PowerShell 5.1
        shell: bash
        env:
          PS_EXE: powershell
        run: bash scripts/ci/guard-fixtures.sh --impl ps
      - name: Guard fixtures, guard.ps1 under PowerShell 7
        shell: bash
        env:
          PS_EXE: pwsh
        run: bash scripts/ci/guard-fixtures.sh --impl ps
      - name: Guard fixtures, guard.sh under Git Bash
        shell: bash
        run: bash scripts/ci/guard-fixtures.sh --impl sh
      - name: Guard parity (Git Bash vs Windows PowerShell 5.1)
        shell: bash
        env:
          PS_EXE: powershell
        run: bash scripts/ci/guard-parity.sh
      - name: my-data backup and reset (Windows PowerShell 5.1)
        shell: bash
        env:
          PS_EXE: powershell
        run: bash scripts/ci/mydata-smoke.sh --impl ps
      - name: my-data backup and reset (Git Bash)
        shell: bash
        run: bash scripts/ci/mydata-smoke.sh --impl sh
      - name: Startup summary (Git Bash, and session-start.ps1 under Windows PowerShell 5.1)
        shell: bash
        env:
          PS_EXE: powershell
        run: |
          bash scripts/ci/summary-fixtures.sh --impl sh
          bash scripts/ci/summary-fixtures.sh --impl ps
      - name: Health check fixtures (Git Bash, and health.ps1 under Windows PowerShell 5.1)
        shell: bash
        env:
          PS_EXE: powershell
        run: |
          bash scripts/ci/health-fixtures.sh --impl sh
          bash scripts/ci/health-fixtures.sh --impl ps
      - name: Health check (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .claude\skills\health\scripts\health.ps1
          $out
          if (-not ($out -match '^OK: safety check \(PowerShell\)')) { exit 1 }
          if (-not ($out -match '^OK: safety check \(bash\)')) { exit 1 }
          if (-not ($out -match '^OK: Git Bash')) { exit 1 }

  # The end-to-end suites are slow on Windows (Git Bash starts processes slowly): one suite can take
  # 20 minutes. Each runs in its own job, in parallel, so no single job comes near its time limit.
  windows-e2e:
    name: Windows end-to-end (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Git Bash, fresh clone
            ps: ""
            run: python scripts/ci/e2e-fresh.py --impl sh
          - name: Git Bash, /update
            ps: ""
            run: python scripts/ci/e2e-update.py --impl sh
          - name: Git Bash, /my-data and sample workspace
            ps: ""
            run: python scripts/ci/e2e-mydata.py --impl sh && python scripts/ci/e2e-sample.py --impl sh
          - name: Windows PowerShell 5.1, fresh clone
            ps: powershell
            run: python scripts/ci/e2e-fresh.py --impl ps
          - name: Windows PowerShell 5.1, /update
            ps: powershell
            run: python scripts/ci/e2e-update.py --impl ps
          - name: Windows PowerShell 5.1, /my-data and sample workspace
            ps: powershell
            run: python scripts/ci/e2e-mydata.py --impl ps && python scripts/ci/e2e-sample.py --impl ps
          - name: PowerShell 7, /update, /my-data and sample workspace
            ps: pwsh
            run: python scripts/ci/e2e-update.py --impl ps && python scripts/ci/e2e-mydata.py --impl ps && python scripts/ci/e2e-sample.py --impl ps
          - name: theme + git pull with Windows line endings
            ps: ""
            run: python scripts/ci/e2e-theme-git.py && python scripts/ci/check-dashboard-type.py
    steps:
      # Keep Windows' usual line-ending conversion on, as on users' machines; .gitattributes keeps .sh files LF.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: ${{ matrix.name }}
        shell: bash
        env:
          PS_EXE: ${{ matrix.ps }}
        run: ${{ matrix.run }}

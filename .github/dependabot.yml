# Keeps the GitHub Actions used by CI and the release workflow on current versions.
# The app itself has no package dependencies to update (its page libraries are pinned in templates/assets/).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
